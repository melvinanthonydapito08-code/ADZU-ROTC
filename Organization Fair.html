   <style> 
body {
  margin: 0;
  padding: 60px 0;
  background: #0c0c0c;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  transform: scale(0.92);
  transform-origin: top center;
  padding-top: 95px;
}

.container {
  width: 100%;
  max-width: 1350px;
  padding: 0 40px;
  color: bisque;
}

.event-title {
  font-size: 36px;
  font-weight: 700;
  margin-bottom: 28px;
  color: white;
}

.slide {
  width: 100%;
  margin-bottom: 60px;
  padding-top:80px;
}

.item {
  background: #111;
  border: 2px solid #ff2e2e;
  border-radius: 20px;
  padding: 40px 30px;
  text-align: center;
  transition: 0.3s ease;
  overflow: hidden;
  position: relative;
}

.item:hover {
  transform: translateY(-6px);
  box-shadow: 0 0 20px rgba(255, 20, 20, 0.35);
}

.box {
  width: 55px;
  height: 55px;
  background: #ff2e2e22;
  border-radius: 50%;
  margin: 0 auto 10px;
  box-sizing: unset;
}

.caption {
  font-size: 26px;
  font-weight: 700;
  margin: 10px 0 15px;
   
  color: #ff3b3b;

}

.caption::after {
  content: "";
  width: 60%;
  height: 3px;
  background: #ff2e2e;
  display: block;
  margin: 10px auto 20px;
}

/* --- CAROUSEL, for the picture to scroll inside the box --- */
.auto-scroll {
  display: flex;
  gap: 12px;
  overflow: hidden;
}

.auto-scroll img {
  width: 250px;
  height: 180px;
  object-fit: cover;
  border-radius: 10px;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.2s ease;
}

.auto-scroll img:hover {
  transform: scale(1.05);
}

/* --- ARROWS, for the images to move for every click by the user, it will move.  --- */
.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255,0,0,0.3);
  border: 2px solid #ff2e2e;
  color: white;
  font-size: 24px;
  padding: 10px 14px;
  border-radius: 6px;
  cursor: pointer;
  user-select: none;
}

.arrow-left { left: 10px; }
.arrow-right { right: 10px; }

/* --- LIGHTBOX --- *//*IF THE USER CLICKS ON THE PICTURE, IT WILL POP UP ITS OWN WINDOW*/
#lightbox {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.9);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

#lightbox img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 10px;
}

#lightbox span {
  position: absolute;
  top: 30px;
  right: 40px;
  font-size: 36px;
  color: white;
  cursor: pointer;
}
</style>

<script>

document.querySelectorAll(".event-title").forEach((title, index) => {
  const key = "eventTitle" + index;
  if (localStorage.getItem(key)) title.textContent = localStorage.getItem(key);
  title.addEventListener("input", () => localStorage.setItem(key, title.textContent));
});

/*Fuctions for the Lightbox features*/
const lightbox = document.getElementById('lightbox');
const lightboxImg = lightbox.querySelector('img');

document.querySelectorAll('.auto-scroll img').forEach(img => {
  img.addEventListener('click', () => {
    lightbox.style.display = 'flex';
    lightboxImg.src = img.src;
  });
});

function closeLightbox() {
  lightbox.style.display = 'none';
}

/* Function for the left and right arrows to keep on looping, for the images to continue to show up in each click  */
document.querySelectorAll('.item').forEach(item => {
  const track = item.querySelector('.auto-scroll');
  const prevArrow = item.querySelector('.arrow-left');
  const nextArrow = item.querySelector('.arrow-right');

  prevArrow.addEventListener('click', e => {
    e.preventDefault();
    // Moves last image to the front
    track.insertBefore(track.lastElementChild, track.firstElementChild);
  });

  nextArrow.addEventListener('click', e => {
    e.preventDefault();
    // Moves first image to the end
    track.appendChild(track.firstElementChild);
  });
});
</script>
