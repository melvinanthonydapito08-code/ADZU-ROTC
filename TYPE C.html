<body>
    <style>
        *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Arial', sans-serif;
        }
        body {
        font-family: 'Arial', sans-serif;
        background-image: radial-gradient(circle at center, rgb(45, 1, 9), black);
        color: white;
        height: 100dvh;
        height: 100vh;
        margin-bottom: 30px;
        min-height: fit-content;
        }
        .title {
        text-align: center;
        justify-content: center;
        align-items: center;
        display: flex;
        margin: 50px;
        animation: fadeIn 1.5s ease-in-out;
        letter-spacing: 4px;
        padding-top:90px;
        font-size: 45px;
        text-shadow: 0 0 20px rgba(255, 70, 70, 0.8);
        text-transform: uppercase;
        color: #ff3b3b;
        }
        .opener {
        text-align: center;
        justify-content: center;
        align-items: center;
        display: flex;
        margin-bottom: 30px;
        margin-top: 10px;
        animation: fadeIn 2s ease-in-out;
        font-weight: bold;
        text-decoration: underline solid #ff3b3bd4 1.5px;
        text-underline-offset: 15px;
        font-size: 25px;
          color: #ff3b3b;
        }

/*GOU UNIFORM*/
        .typec {
        background-color: #1a1a1a;
        border: 2px solid #ff3b3b;
        display: grid;
        display: flex;
        flex: 1;
        grid-template-columns: repeat(2, 1fr);
        padding: min(5em, 2%);
        border-radius: 20px;
        position: relative;
        width: 100%;
        max-width: 1100px;
        margin: auto;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        animation: fadeIn 1s ease-in;
        justify-content: center;
        align-items: center;
        }
        .typec:hover {
        box-shadow: 0 10px 30px rgba(255, 59, 59, 0.6);
        }
        .typec img {
        margin: 15px;
        border: 1px solid white;
        border-radius: 10px;
        height: 500px;
        width: auto;
        transition: transform 0.5s ease, box-shadow 0.3s ease;
        }
        .typec img:hover {
        transform: translateY(-10px) scale(1.1);
        transition: transform 1s ease, box-shadow 0.3s ease;
        box-shadow: 0 0px 20px rgba(255, 255, 255, 0.575);
        }

/*KEYFRAMES*/
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
/* TABLET SIZE (max-width: 900px) */
@media (max-width: 500px) {
  .typec {
    width: 48%;
    gap: 20px;
  }

  .title {
    font-size: 30px;
    letter-spacing: 3px;
  }
}

/* LARGE MOBILE (max-width: 650px) */
@media (max-width: 650px) {
  .typec {
    width: 100%;
    padding: 20px;
  }

  .typec img {
    height: 160px;
  }

  .opener {
    font-size: 20px;
  }

  .title {
    font-size: 26px;
  }
}

/* SMALL MOBILE (max-width: 450px) */
@media (max-width: 450px) {

  .title {
    font-size: 22px;
    letter-spacing: 2px;
  }

  .opener {
    font-size: 18px;
  }

  .typec img {
    height: 140px;
  }
}
    </style>
